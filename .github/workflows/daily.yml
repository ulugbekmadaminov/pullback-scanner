name: Kundalik skaner

on:
  schedule:
    - cron: "40 21 * * 1-5"   # AQSh bozori yopilgach (21:40 UTC = Zagreb 22:40/23:40)
  workflow_dispatch:
    inputs:
      demo:
        description: "DEMO ma'lumot bilan (sinov uchun)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Narx keshi
        uses: actions/cache@v4
        with:
          path: .cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-

      - name: Python kutubxonalari
        run: pip install -r requirements.txt

      - name: Dvigatel testlari
        run: python -m pytest -q -m "not slow"

      - name: Skaner
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ inputs.demo }}" = "true" ]; then python -m engine.pipeline --demo; else python -m engine.pipeline; fi

      - name: Holatni saqlash (audit izi)
        if: ${{ inputs.demo != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "skaner: $(date -u +%Y-%m-%d)" || echo "O'zgarish yo'q"
          git push

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Ilovani yig'ish
        working-directory: app
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_BASE: /${{ github.event.repository.name }}/
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: scan
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
